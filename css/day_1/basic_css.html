<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styled Doc</title>
    <style>
      h3 {
        color: blue;
      }

      h4 {
        color: yellow;
      }

      h5 {
        color: red;
      }
    </style>
  </head>
  <body>
    <h2>Styled Document</h2>
    <h3>Hey! I am Blue</h3>
    <h4>Hey! I am Yellow</h4>
    <h5>Hey! I am Red</h5>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Selector</title>

    <style>
      * {
        background-color: beige;
        text-align: center;
      }

      p {
        color: blue;
      }

      .blue {
        color: blue;
      }

      .green {
        color: green;
      }

      .purple {
        color: purple;
      }

      #title {
        font-size: large;
        color: brown;
      }

      /* h3,
      p,
      h4,
      h5 {
        text-decoration: underline;
      } */

      .underline {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div>
      <h3 class="underline" id="title">Heading</h3>
      <p class="blue underline">Text - Blue</p>
      <p class="green underline">Text 2 - Green</p>
      <p class="purple underline">Text 3 - Purple</p>
      <h4 class="underline">Link</h4>
      <h5 class="underline">Another title</h5>
    </div>
  </body>
</html>
